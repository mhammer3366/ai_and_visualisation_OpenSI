[project]
name = "ai-and-visualisation-opensi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7",
    "huggingface-hub>=0.25",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.0",
    "pillow>=13.0.0",
    "plotly>=5.0",
    "pyarrow>=26.0.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "tqdm>=4.70.1",
    "transformers>=4.45",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
